<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>شاشة طلبات الويترية | Odoo POS Restaurant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="waiter.css" />
</head>
<body>

  <!-- شريط الرأس للويتر -->
  <header class="waiter-header">
    <div class="header-left">
      <span class="logo-badge">🍽️ POS الويتر</span>
      <div class="user-info">
        <span>مرحباً، </span><strong id="waiterName">الويتر</strong>
      </div>
    </div>
    <div class="header-right">
      <a href="/kitchen-prep.html" class="btn-header">👨‍🍳 تحضير الوصفات والباركود</a>
      <a href="/kitchen-audit.html" class="btn-header">⚖️ جرد ومطابقة السكاشن</a>
      <a href="/dashboard/dashboard.html" class="btn-header">📊 الداشبورد</a>
      <a href="/accounting.html" class="btn-header">💰 الحسابات</a>
      <button class="btn-header" id="logoutBtn" style="color:#f87171;">خروج</button>
    </div>
  </header>

  <!-- شاشة 1: خريطة الصالات والطاولات -->
  <div id="tablesSection">
    <div class="floors-bar" id="floorsBar">
      <!-- أزرار الصالات ستولد برمجياً -->
    </div>

    <div class="tables-container">
      <div class="tables-grid" id="tablesGrid">
        <!-- كروت الطاولات ستولد برمجياً -->
      </div>
    </div>
  </div>

  <!-- شاشة 2: تسجيل طلب طاولة (Order Pad) -->
  <div class="order-view" id="orderView">
    <!-- قائمة الطعام والأصناف -->
    <section class="menu-section">
      <div class="menu-toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="menuSearchInput" placeholder="بحث سريع عن وجبة أو صنف بالاسم أو القسم..." oninput="onSearchMenu(this.value)" />
        </div>
        <div class="items-count-badge" id="menuCountBadge">جاري التحميل...</div>
      </div>
      <div class="categories-bar" id="categoriesBar">
        <!-- أقسام المنيو -->
      </div>
      <div class="menu-grid" id="menuGrid">
        <!-- كروت المنيو -->
      </div>
    </section>

    <!-- سلة الطلب الحالية -->
    <aside class="cart-section">
      <div class="cart-header">
        <span class="table-title" id="cartTableTitle">🍽️ طاولة</span>
        <button class="btn-back-tables" onclick="backToTables()">⬅️ الطاولات</button>
      </div>

      <div class="cart-items" id="cartItems">
        <!-- عناصر السلة -->
      </div>

      <div class="cart-footer">
        <div class="cart-total-row">
          <span>المجموع الكلي:</span>
          <span class="cart-total-val" id="cartTotalVal">0 د.ع</span>
        </div>
        <div class="cart-buttons">
          <button class="btn-send" id="btnSendOrder" onclick="sendOrderToKitchen()">
            🚀 إرسال إلى المطبخ وطباعة الكبونات
          </button>
          <button class="btn-pay" onclick="payAndReleaseTable()">
            💵 دفع وإخلاء الطاولة
          </button>
          <button class="btn-back-tables" onclick="backToTables()">
            ❌ إلغاء
          </button>
        </div>
      </div>
    </aside>
  </div>

  <!-- نافذة منبثقة لإضافة ملاحظات المطبخ المتعددة -->
  <div class="modal-overlay" id="noteModal">
    <div class="modal-content notes-modal-box">
      <div class="modal-header-row">
        <h3 class="modal-title" id="noteModalItemTitle">📝 ملاحظات المطبخ والتحضير</h3>
        <button class="modal-close-btn" onclick="closeNoteModal()" title="إغلاق">✕</button>
      </div>

      <!-- الملاحظات المختارة حالياً لهذا الصنف -->
      <div class="selected-notes-container">
        <div class="notes-section-label">الملاحظات النشطة على هذا الصنف:</div>
        <div class="active-notes-tags" id="activeNotesTags">
          <!-- ستولد هنا وسوم الملاحظات مع زر الحذف -->
        </div>
      </div>

      <!-- إدخال ملاحظة مخصصة يدوياً -->
      <div class="custom-note-group">
        <label class="notes-section-label">✍️ كتابة ملاحظة مخصصة إضافية:</label>
        <div class="custom-note-input-row">
          <input type="text" id="customNoteInput" class="modal-input" placeholder="اكتب ملاحظة (مثلاً: خبز خفيف، بدون ملح، صوص في علبة)..." onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomNote();}" />
          <button type="button" class="btn-add-custom-note" onclick="addCustomNote()">➕ إضافة</button>
        </div>
      </div>

      <!-- اقتراحات سريعة للملاحظات الشائعة بضغطة زر -->
      <div class="quick-notes-group">
        <div class="notes-section-label">⚡ خيارات سريعة شائعة (اضغط للإضافة أو الإلغاء فوراً):</div>
        <div class="quick-chips-grid" id="quickChipsGrid">
          <!-- ستولد أزرار الخيارات السريعة برمجياً -->
        </div>
      </div>

      <div class="modal-actions-bar">
        <button type="button" class="btn-clear-notes" onclick="clearAllItemNotes()">🗑️ مسح الكل</button>
        <div style="display:flex; gap: 10px;">
          <button type="button" class="btn-back-tables" onclick="closeNoteModal()">إلغاء</button>
          <button type="button" class="btn-save-notes" onclick="saveItemNotes()">💾 اعتماد الملاحظات</button>
        </div>
      </div>
    </div>
  </div>

  <script src="waiter.js"></script>
</body>
</html>
